<!doctype html>
<html lang="en-GB" data-theme="dark" data-text="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadrant</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/tools.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <!-- The mark is the health dial in miniature: four arcs. -->
        <g fill="none" stroke-width="4.2" stroke-linecap="round">
          <path class="mark-a" d="M19.6 4.3A13 13 0 0 1 29.7 14.4"/>
          <path class="mark-b" d="M29.7 19.6A13 13 0 0 1 19.6 29.7"/>
          <path class="mark-c" d="M14.4 29.7A13 13 0 0 1 4.3 19.6"/>
          <path class="mark-d" d="M4.3 14.4A13 13 0 0 1 14.4 4.3"/>
        </g>
        <circle class="mark-dot" cx="17" cy="17" r="3.4"/>
      </svg>
      <div>
        <div class="brand-name">Quadrant</div>
        <div class="brand-tag">Honest PC care</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Tools"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
